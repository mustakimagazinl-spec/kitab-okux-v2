let GROUP_ID = null;
let STATE = { persons:[], entries:[], cycles:[], activeCycle:null };

function gDoc(path) { return doc(db, 'groups', GROUP_ID, ...path.split('/')); }

async function loadAll() {
  const [pS,eS,cS,aS] = await Promise.all([
    getDoc(gDoc('data/persons')),
    getDoc(gDoc('data/entries')),
    getDoc(gDoc('data/cycles')),
    getDoc(gDoc('data/activeCycle')),
  ]);
  STATE.persons     = pS.exists() ? pS.data().list  || [] : [];
  STATE.entries     = eS.exists() ? eS.data().list  || [] : [];
  STATE.cycles      = cS.exists() ? cS.data().list  || [] : [];
  STATE.activeCycle = aS.exists() ? aS.data().value || null : null;
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function today() {
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function initials(n){return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function pal(i){return PALETTES[i%PALETTES.length];}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function setHTML(id,html){const e=document.getElementById(id);if(e)e.innerHTML=html;}

function calcStreak(person){
  const cycle=STATE.activeCycle;
  const dates=[...new Set(STATE.entries.filter(e=>e.person===person&&(!cycle||e.cycleId===cycle.id)).map(e=>e.date))].sort().reverse();
  if(!dates.length)return 0;
  let streak=0,cur=new Date(today());
  for(let d of dates){
    const diff=Math.round((cur-new Date(d))/86400000);
    if(diff===streak){streak++;cur=new Date(d);}else if(diff>1)break;
  }
  return streak;
}
function isInactive(person){
  const cycle=STATE.activeCycle;
  const last=STATE.entries.filter(e=>e.person===person&&(!cycle||e.cycleId===cycle.id)).map(e=>e.date).sort().pop();
  if(!last)return true;
  return daysBetween(last,today())>=INACTIVE_DAYS;
}
function getPersonBooks(name){
  const fromEntries=[...new Set(STATE.entries.filter(e=>e.person===name&&e.book).map(e=>e.book))];
  const fromPerson=STATE.persons.find(p=>p.name===name)?.book||'';
  return [...new Set([fromPerson,...fromEntries].filter(Boolean))];
}

    500:'سۇبھاناللاھ! 500 بەت! «ئىلىم تەلەپ قىلىش ھەر بىر مۇسۇلمانغا پەرزدۇر.» سىز بۇ پەرزنى ئادا قىلىۋاتىسىز! 🌟',
    1000:'ئاللاھۇ ئەكبەر! 1000 بەت! بۇ ئىرادە، سەبىر ۋە ئىخلاسنىڭ نەتىجىسى. ئاللاھ مۇبارەك قىلسۇن! 🏆',

  };
  return milestones[totalPages]||null;

window.ppAddBook=async function(name,idx){
  const val=document.getElementById('pp-newbook')?.value?.trim();
  if(!val)return;
  const pidx=STATE.persons.findIndex(p=>p.name===name);
  if(pidx>=0&&!STATE.persons[pidx].book){STATE.persons[pidx].book=val;await savePersons();}
  const msg=document.getElementById('pp-book-msg');
  if(msg){msg.textContent=val+' قوشۇلدى! بەت خاتىرىلەشتە تاللىيالايسىز.';msg.style.display='block';msg.style.color='#3B6D11';}
  document.getElementById('pp-newbook').value='';
  setTimeout(()=>renderParticipant(name,idx),600);
};

window.ppSaveIntention=async function(name,idx){
  const val=document.getElementById('pp-intention')?.value?.trim()||'';
  const pidx=STATE.persons.findIndex(p=>p.name===name);
  if(pidx>=0){STATE.persons[pidx].intention=val;await savePersons();}
  const msg=document.getElementById('pp-intention-msg');
  if(msg){msg.textContent='«نِيَّةُ الْمُؤْمِنِ خَيْرٌ مِنْ عَمَلِهِ» — نىيىتىڭىز ساقلاندى! 🤲';msg.style.display='block';msg.style.color='#3B6D11';}
  setTimeout(()=>renderParticipant(name,idx),800);
};

window.ppEditRow=function(ei,gIdx,name,idx){
  const e=STATE.entries[gIdx];if(!e)return;
  const pl=pal(idx);
  const row=document.getElementById('pp-row-'+ei);
  row.innerHTML=`<span style="color:${pl.avatarText};min-width:95px">${e.date}</span>
    <input type="number" id="pp-inline-${ei}" value="${e.pages}" min="1"
      style="width:70px;padding:4px 8px;border:1.5px solid ${pl.metric};border-radius:6px;font-size:13px"/>
    <span style="font-size:12px;color:${pl.metric}">بەت</span>
    <button onclick="ppSaveRow(${ei},${gIdx},'${name.replace(/'/g,"\\'")}',${idx})"
      style="background:${pl.metric};color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">ساقلاش</button>
    <button onclick="renderParticipant('${name.replace(/'/g,"\\'")}',${idx})"
      style="background:none;border:0.5px solid #ddd;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:#888">بىكار</button>`;

window.ppSaveRow=async function(ei,gIdx,name,idx){
  const val=parseInt(document.getElementById('pp-inline-'+ei)?.value);
  if(!val||val<1){alert('توغرا بەت سانى كىرگۈزۈڭ.');return;}
  STATE.entries[gIdx].pages=val;await saveEntries();renderParticipant(name,idx);
};

window.ppDeleteEntry=async function(gIdx,name,idx){
  if(!confirm('بۇ خاتىرىنى ئۆچۈرەمسىز؟'))return;
  STATE.entries.splice(gIdx,1);await saveEntries();renderParticipant(name,idx);
};

window.submitReading=async function(name,idx){
  const pages=parseInt(document.getElementById('pp-pages').value);
  const date=document.getElementById('pp-date').value;
  if(!pages||pages<1){showPPMsg('بەت سانىنى كىرگۈزۈڭ','warn');return;}
  let book=document.getElementById('pp-book-sel')?.value||'';
  if(book==='__new__')book=document.getElementById('pp-inline-newbook')?.value?.trim()||'';
  const cycle=STATE.activeCycle;
  const existing=STATE.entries.findIndex(e=>e.person===name&&e.date===date&&(!cycle||e.cycleId===cycle?.id));
  if(existing>=0)STATE.entries.splice(existing,1);
  STATE.entries.push({person:name,pages,date,book,cycleId:cycle?.id||'free'});
  if(book){const pidx=STATE.persons.findIndex(p=>p.name===name);if(pidx>=0&&!STATE.persons[pidx].book){STATE.persons[pidx].book=book;await savePersons();}}
  await saveEntries();
  showPPMsg(pages+' بەت مۇۋەپپەقىيەتلىك ساقلاندى! ✅','success');
  setTimeout(()=>renderParticipant(name,idx),700);
};

function showPPMsg(txt,type){
  const el=document.getElementById('pp-msg');if(!el)return;
  el.style.display='block';el.style.color=type==='success'?'#3B6D11':'#993C1D';el.textContent=txt;
}

      ${[0,1,2,3].map(i=>`<div id="pd${i}" style="width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid #ccc;transition:background .15s"></div>`).join('')}

window.pinTap=async function(k){
  if(k==='⌫'){pinEntry=pinEntry.slice(0,-1);}
  else if(pinEntry.length<4&&k!==''){pinEntry+=k;}
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.style.background=i<pinEntry.length?'#534AB7':'#eee';d.style.borderColor=i<pinEntry.length?'#534AB7':'#ccc';}}
  if(pinEntry.length===4){
    const snap=await getDoc(doc(db,'groups',GROUP_ID));
    const correctPin=snap.exists()?snap.data().pin:'1234';
    if(pinEntry===correctPin){showView('view-admin');renderAdmin('members');}
    else{document.getElementById('pin-error').textContent='PIN خاتا. قايتا سىناڭ.';pinEntry='';for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.style.background='#eee';d.style.borderColor='#ccc';}}}
  }
};

  else if(tab==='entries')el.innerHTML=tabEntries();
  else if(tab==='summary')el.innerHTML=tabSummary();
  else if(tab==='leaderboard')el.innerHTML=tabLeaderboard();
  else if(tab==='archive')el.innerHTML=tabArchive();
  else if(tab==='export')el.innerHTML=tabExport();
  else if(tab==='settings')el.innerHTML=tabSettings();
  else if(tab==='migrate')el.innerHTML=tabMigrate();
}

window.adminAddPerson=async function(){
  const name=document.getElementById('am-name')?.value?.trim();
  if(!name)return;
  if(STATE.persons.find(p=>p.name===name)){alert('بۇ ئىسىم مەۋجۇت.');return;}
  STATE.persons.push({name,book:'',intention:''});await savePersons();
  const msg=document.getElementById('am-msg');
  if(msg){msg.textContent=name+' قوشۇلدى.';msg.style.display='block';setTimeout(()=>msg.style.display='none',2000);}
  renderAdminTab('members');
};

window.removePerson=async function(idx){
  if(!confirm(STATE.persons[idx].name+' نى ئۆچۈرەمسىز؟'))return;
  STATE.persons.splice(idx,1);await savePersons();renderAdminTab('members');
};

function tabCycle(){
  const cycle=STATE.activeCycle;
  let html=`<div style="background:#fff;border:0.5px solid #eee;border-radius:14px;padding:1.25rem">`;
  if(cycle){
    html+=`<div style="background:#EAF3DE;border-radius:10px;padding:10px 14px;margin-bottom:1rem;color:#27500A;font-size:13px">پائال چەمبەر: <strong>${cycle.name}</strong> — ${cycle.start}</div>
    <button onclick="endCycle()" style="background:#BA7517;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer">چەمبەرنى ئاخىرلاشتۇرۇش</button>`;
  } else {
    html+=`<div style="font-size:14px;font-weight:500;margin-bottom:12px">يېڭى چەمبەر باشلاش</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div style="flex:1;min-width:160px">
        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">چەمبەر ئىسمى</label>
        <input type="text" id="cy-name" placeholder="مەسىلەن: مايىس 2026" style="width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px"/>
      </div>
      <div>
        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px">باشلاش كۈنى</label>
        <input type="date" id="cy-start" value="${today()}" style="padding:9px 12px;border:1px solid #ddd;border-radius:10px;font-size:14px"/>
      </div>
    </div>
    <button onclick="startCycle()" style="background:#534AB7;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer">چەمبەر باشلاش</button>`;
  }
  html+=`</div>`;return html;
}

window.startCycle=async function(){
  const name=document.getElementById('cy-name')?.value?.trim();
  const start=document.getElementById('cy-start')?.value;
  if(!name||!start){alert('ئىسىم ۋە كۈننى كىرگۈزۈڭ.');return;}
  STATE.activeCycle={id:'cycle_'+Date.now(),name,start,end:null};await saveActiveCycle();renderAdminTab('cycle');
};

window.endCycle=async function(){
  if(!confirm('چەمبەرنى ئاخىرلاشتۇرامسىز؟'))return;
  STATE.activeCycle.end=today();
  STATE.cycles.push({...STATE.activeCycle,entries:STATE.entries.filter(e=>e.cycleId===STATE.activeCycle.id)});
  await saveCycles();STATE.activeCycle=null;await saveActiveCycle();
  showEndCycleMsg();
};

function showEndCycleMsg(){
  const el=document.getElementById('admin-body');
  if(el)el.innerHTML=`<div style="background:#EAF3DE;border-radius:14px;padding:2rem;text-align:center">
    <div style="font-size:24px;margin-bottom:8px">📚</div>
    <div style="font-size:16px;font-weight:600;color:#085041;margin-bottom:8px">اَلْحَمْدُ لِلَّهِ!</div>
    <div style="font-size:13px;color:#27500A;line-height:1.8;margin-bottom:1rem">بۇ چەمبەر مۇۋەپپەقىيەتلىك تاماملاندى. ھەممىڭلارنىڭ ئەمگىكى قوبۇل بولسۇن!<br>«ئادەم ئۆلگەندە پايدىلىق ئىلىم ئۇنىڭ نامىغا سەۋاب بولۇپ يېزىلىپ تۇرىدۇ.»</div>
    <button onclick="renderAdmin('archive')" style="background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer">ئارخىپنى كۆرۈش</button>
  </div>`;
}

function tabEntries(){
  const cycle=STATE.activeCycle;
  const entries=STATE.entries.filter(e=>!cycle||e.cycleId===cycle.id).slice().sort((a,b)=>b.date.localeCompare(a.date));
  let html=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <div style="font-size:14px;font-weight:500">${cycle?cycle.name+' — خاتىرىلەر':'بارلىق خاتىرىلەر'}</div>
    <div style="font-size:12px;color:#888">${entries.length} خاتىرە</div>
  </div>`;
  if(!entries.length)return html+`<div style="background:#FAEEDA;border-radius:10px;padding:10px 14px;color:#633806;font-size:13px">خاتىرە يوق.</div>`;
  html+=`<div style="background:#fff;border:0.5px solid #eee;border-radius:14px;overflow:hidden">`;
  entries.forEach((e,i)=>{
    const pidx=STATE.persons.findIndex(p=>p.name===e.person);
    const pl=pal(pidx>=0?pidx:i%8);
    const gIdx=STATE.entries.findIndex(x=>x.person===e.person&&x.date===e.date&&x.cycleId===e.cycleId&&x.pages===e.pages);
    html+=`<div id="adm-row-${i}" style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid #f5f5f5;flex-wrap:wrap">
      <div style="width:28px;height:28px;border-radius:50%;background:${pl.avatar};color:${pl.avatarText};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0">${initials(e.person)}</div>
      <div style="flex:1;min-width:100px"><div style="font-weight:500;font-size:13px">${e.person}</div><div style="font-size:11px;color:#888">${e.date}${e.book?' — '+e.book:''}</div></div>
      <span style="font-weight:600;color:${pl.metric};font-size:14px">${e.pages} بەت</span>
      <button onclick="admEditEntry(${i},${gIdx},'${pl.metric}','${pl.bg}')"
        style="background:none;border:0.5px solid ${pl.border};border-radius:6px;padding:4px 10px;font-size:11px;color:${pl.metric};cursor:pointer">تەھرىر</button>
      <button onclick="admDeleteEntry(${gIdx})"
        style="background:none;border:0.5px solid #F0957580;border-radius:6px;padding:4px 10px;font-size:11px;color:#A32D2D;cursor:pointer">ئۆچۈر</button>
    </div>`;
  });
  html+=`</div>`;return html;
}

window.admDeleteEntry=async function(gIdx){
  if(!confirm('ئۆچۈرەمسىز؟'))return;
  STATE.entries.splice(gIdx,1);await saveEntries();renderAdminTab('entries');
};
window.admEditEntry=function(i,gIdx,mc,bg){
  const e=STATE.entries[gIdx];if(!e)return;
  const row=document.getElementById('adm-row-'+i);
  row.innerHTML=`<div style="flex:1"><div style="font-weight:500;font-size:13px">${e.person}</div><div style="font-size:11px;color:#888">${e.date}</div></div>
    <input type="number" id="adm-inline-${i}" value="${e.pages}" min="1" style="width:70px;padding:5px 8px;border:1.5px solid ${mc};border-radius:6px;font-size:13px"/>
    <button onclick="admSaveEntry(${i},${gIdx})" style="background:${mc};color:#fff;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer">ساقلاش</button>
    <button onclick="renderAdminTab('entries')" style="background:none;border:0.5px solid #ddd;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;color:#888">بىكار</button>`;
};
window.admSaveEntry=async function(i,gIdx){
  const val=parseInt(document.getElementById('adm-inline-'+i)?.value);
  if(!val||val<1){alert('توغرا سان كىرگۈزۈڭ.');return;}
  STATE.entries[gIdx].pages=val;await saveEntries();renderAdminTab('entries');
};

function tabSummary(){
  const cycle=STATE.activeCycle;
  if(!cycle)return`<div style="background:#FAEEDA;border-radius:10px;padding:10px 14px;color:#633806;font-size:13px">پائال چەمبەر يوق.</div>`;
  let html=`<div style="font-size:13px;color:#888;margin-bottom:1rem"><span style="font-weight:600;color:#534AB7">${cycle.name}</span> خۇلاسىسى</div>`;
  STATE.persons.forEach((p,i)=>{
    const pl=pal(i);
    const pe=STATE.entries.filter(e=>e.person===p.name&&e.cycleId===cycle.id);
    const total=pe.reduce((s,e)=>s+e.pages,0);
    const days=new Set(pe.map(e=>e.date)).size;
    const avg=days?Math.round(total/days):0;
    const streak=calcStreak(p.name);
    const books=[...new Set(pe.filter(e=>e.book).map(e=>e.book))];
    html+=`<div style="background:#fff;border:0.5px solid #eee;border-left:3px solid ${pl.metric};border-radius:0 14px 14px 0;padding:1.25rem;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="width:38px;height:38px;border-radius:50%;background:${pl.avatar};color:${pl.avatarText};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600">${initials(p.name)}</div>
        <div><div style="font-weight:600">${p.name}</div><div style="font-size:12px;color:#888">${books.join(', ')||'كىتاب يوق'}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
        <div style="background:${pl.bg};border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:${pl.metric};font-weight:600">ئومۇمىي</div><div style="font-size:20px;font-weight:700;color:${pl.avatarText}">${total}</div></div>
        <div style="background:${pl.bg};border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:${pl.metric};font-weight:600">كۈن</div><div style="font-size:20px;font-weight:700;color:${pl.avatarText}">${days}</div></div>
        <div style="background:${pl.bg};border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:${pl.metric};font-weight:600">ئوتتۇرا</div><div style="font-size:20px;font-weight:700;color:${pl.avatarText}">${avg}</div></div>
        <div style="background:${pl.bg};border-radius:8px;padding:10px;text-align:center"><div style="font-size:10px;color:${pl.metric};font-weight:600">رەت</div><div style="font-size:20px;font-weight:700;color:${pl.avatarText}">${streak}🔥</div></div>
      </div>
      ${p.intention?`<div style="margin-top:10px;font-size:12px;color:#888;background:${pl.bg};border-radius:8px;padding:8px 10px">🤲 نىيىتى: "${p.intention}"</div>`:''}
    </div>`;
  });
  return html;
}

function tabLeaderboard(){
  const cycle=STATE.activeCycle;
  if(!cycle)return`<div style="background:#FAEEDA;border-radius:10px;padding:10px 14px;color:#633806;font-size:13px">پائال چەمبەر يوق.</div>`;
  const stats=STATE.persons.map((p,i)=>{
    const pe=STATE.entries.filter(e=>e.person===p.name&&e.cycleId===cycle.id);
    return{name:p.name,total:pe.reduce((s,e)=>s+e.pages,0),days:new Set(pe.map(e=>e.date)).size,i,inactive:isInactive(p.name),streak:calcStreak(p.name)};
  }).sort((a,b)=>b.total-a.total);
  const maxPages=stats[0]?.total||1;
  const totalGroup=stats.reduce((s,x)=>s+x.total,0);
  const medals=['🥇','🥈','🥉'];
  let html=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem">
    <div style="background:#EEEDFE;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#534AB7;font-weight:600">جەمئىي بەت</div><div style="font-size:22px;font-weight:700;color:#26215C">${totalGroup}</div></div>
    <div style="background:#E1F5EE;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#0F6E56;font-weight:600">بىرىنچى</div><div style="font-size:13px;font-weight:700;color:#04342C">${stats[0]?.name||'-'}</div></div>
    <div style="background:#E6F1FB;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#185FA5;font-weight:600">ئەزا</div><div style="font-size:22px;font-weight:700;color:#042C53">${STATE.persons.length}</div></div>
  </div>
  <div style="background:#fff;border:0.5px solid #eee;border-radius:14px;overflow:hidden">`;
  stats.forEach((s,rank)=>{
    const pl=pal(s.i);
    const barW=Math.round((s.total/maxPages)*100);
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #f5f5f5">
      <div style="font-size:18px;min-width:28px;text-align:center">${rank<3?medals[rank]:rank+1}</div>
      <div style="width:32px;height:32px;border-radius:50%;background:${pl.avatar};color:${pl.avatarText};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0">${initials(s.name)}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap">
          <span style="font-weight:600;font-size:13px">${s.name}</span>
          ${s.inactive?`<span style="background:#FCEBEB;color:#A32D2D;border-radius:20px;padding:1px 7px;font-size:10px">ھەرىكەتسىز</span>`:`<span style="background:#EAF3DE;color:#3B6D11;border-radius:20px;padding:1px 7px;font-size:10px">ئاكتىپ</span>`}
          ${s.streak>=3?`<span style="background:${pl.metricLight};color:${pl.metric};border-radius:20px;padding:1px 7px;font-size:10px">${s.streak}🔥</span>`:''}
        </div>
        <div style="background:#f0f0f0;border-radius:4px;height:6px;overflow:hidden"><div style="height:100%;width:${barW}%;background:${pl.metric}"></div></div>
      </div>
      <div style="text-align:right;min-width:65px"><div style="font-weight:700;color:${pl.metric};font-size:14px">${s.total}</div><div style="font-size:11px;color:#888">${s.days} كۈن</div></div>
    </div>`;
  });
  html+=`</div>`;return html;
}

function tabArchive(){
  if(!STATE.cycles.length)return`<div style="background:#FAEEDA;border-radius:10px;padding:10px 14px;color:#633806;font-size:13px">ئارخىپ يوق.</div>`;
  let html='';
  STATE.cycles.slice().reverse().forEach(c=>{
    const entries=c.entries||[];
    const total=entries.reduce((s,e)=>s+e.pages,0);
    const persons=[...new Set(entries.map(e=>e.person))];
    html+=`<div style="background:#fff;border:0.5px solid #eee;border-radius:14px;padding:1.25rem;margin-bottom:10px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:6px">
        <div><div style="font-weight:600;font-size:15px;color:#534AB7">${c.name}</div><div style="font-size:12px;color:#888">${c.start} — ${c.end}</div></div>
        <div style="display:flex;gap:6px">
          <span style="background:#EEEDFE;color:#3C3489;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600">${total} بەت</span>
          <span style="background:#E1F5EE;color:#085041;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600">${persons.length} كىشى</span>
        </div>
      </div>`;
    persons.forEach((name,pi)=>{
      const pidx=STATE.persons.findIndex(p=>p.name===name);
      const pl=pal(pidx>=0?pidx:pi);
      const pe=entries.filter(e=>e.person===name);
      const ptotal=pe.reduce((s,e)=>s+e.pages,0);
      const pdays=new Set(pe.map(e=>e.date)).size;
      html+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:0.5px solid #f5f5f5;font-size:13px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:26px;height:26px;border-radius:50%;background:${pl.avatar};color:${pl.avatarText};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600">${initials(name)}</div>
          <span>${name}</span>
        </div>
        <div style="display:flex;gap:12px">
          <span style="color:${pl.metric};font-weight:600">${ptotal} بەت</span>
          <span style="color:#888">${pdays} كۈن</span>
        </div>
      </div>`;
    });
    html+=`</div>`;
  });
  return html;
}

window.changePin=async function(){
  const p1=document.getElementById('new-pin')?.value;

  const msg=document.getElementById('pin-change-msg');
  if(!p1||p1.length!==4||isNaN(p1)){msg.textContent='PIN 4 خانىلىق سان بولۇشى كېرەك.';msg.style.color='#A32D2D';msg.style.display='block';return;}

  msg.textContent='PIN مۇۋەپپەقىيەتلىك ئۆزگەرتىلدى!';msg.style.color='#3B6D11';msg.style.display='block';
};

window.exportExcel=function(){
  const wb=XLSX.utils.book_new();
  const headerStyle={fill:{fgColor:{rgb:'534AB7'}},font:{color:{rgb:'FFFFFF'},bold:true},alignment:{horizontal:'center'}};
  const allCycles=[];
  if(STATE.activeCycle)allCycles.push({...STATE.activeCycle,entries:STATE.entries.filter(e=>e.cycleId===STATE.activeCycle.id)});
  STATE.cycles.slice().reverse().forEach(c=>allCycles.push(c));

  const summaryData=[['چەمبەر','ئىسىم','كىتاب','ئومۇمىي بەت','ئاكتىپ كۈن','ئوتتۇرا بەت/كۈن']];
  allCycles.forEach(c=>{
    (c.entries||[]);
    STATE.persons.forEach(p=>{
      const pe=(c.entries||[]).filter(e=>e.person===p.name);
      const total=pe.reduce((s,e)=>s+e.pages,0);
      const days=new Set(pe.map(e=>e.date)).size;
      summaryData.push([c.name,p.name,getPersonBooks(p.name).join(', '),total,days,days?Math.round(total/days):0]);
    });
  });
  const sWS=XLSX.utils.aoa_to_sheet(summaryData);
  sWS['!cols']=[{wch:22},{wch:18},{wch:28},{wch:14},{wch:12},{wch:16}];
  ['A1','B1','C1','D1','E1','F1'].forEach(c=>{if(sWS[c])sWS[c].s=headerStyle;});
  XLSX.utils.book_append_sheet(wb,sWS,'خۇلاسە');

  allCycles.forEach((c,ci)=>{
    const entries=(c.entries||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const sd=[['ئىسىم','كىتاب','كۈن','بەت سانى']];
    entries.forEach(e=>{
      const p=STATE.persons.find(x=>x.name===e.person);
      sd.push([e.person,e.book||getPersonBooks(e.person).join(', ')||'',e.date,e.pages]);
    });
    const ws=XLSX.utils.aoa_to_sheet(sd);
    ws['!cols']=[{wch:18},{wch:24},{wch:14},{wch:10}];
    ['A1','B1','C1','D1'].forEach(cell=>{if(ws[cell])ws[cell].s=headerStyle;});
    for(let r=1;r<sd.length;r++){
      const pname=sd[r][0];
      const pidx=STATE.persons.findIndex(p=>p.name===pname);
      const pl=PALETTES[pidx>=0?pidx%8:r%8];
      const rc=pl.avatar.replace('#','');const tc=pl.avatarText.replace('#','');
      ['A','B','C','D'].forEach(col=>{const cell=col+(r+1);if(ws[cell])ws[cell].s={fill:{fgColor:{rgb:rc}},font:{color:{rgb:tc}}};});
    }
    XLSX.utils.book_append_sheet(wb,ws,(c.name||('چەمبەر '+(ci+1))).slice(0,28));
  });
  XLSX.writeFile(wb,'kitab-okux-hatirisi.xlsx');
};

// ── MIGRATION ─────────────────────────────────────────────────────────────────
window.migrateOldData = async function() {
  if(!confirm('كونا سانلىق مەلۇماتلارنى يېڭى گۇرۇپپىغا كۆچۈرەمسىز؟'))return;
  const btn = document.getElementById('migrate-btn');
  if(btn){btn.textContent='كۆچۈرۈلۈۋاتىدۇ...';btn.disabled=true;}
  try {
    // Read old data from /app/
    const [pS,eS,cS,aS] = await Promise.all([
      getDoc(doc(db,'app','persons')),
      getDoc(doc(db,'app','entries')),
      getDoc(doc(db,'app','cycles')),
      getDoc(doc(db,'app','activeCycle')),
    ]);
    const oldPersons = pS.exists() ? pS.data().list || [] : [];
    const oldEntries = eS.exists() ? eS.data().list || [] : [];
    const oldCycles  = cS.exists() ? cS.data().list || [] : [];
    const oldCycle   = aS.exists() ? aS.data().value || null : null;

    // Create group record if not exists
    const groupCode = 'okush2026';
    const groupSnap = await getDoc(doc(db,'groups',groupCode));
    if(!groupSnap.exists()){
      await setDoc(doc(db,'groups',groupCode),{
        name:'ئۇيغۇر بىر قەلىب باغچىسى كىتاب ئوقۇش گۇرۇپپىسى',
        pin:'1234',
        createdAt: new Date().toISOString().slice(0,10)
      });
    }

    // Write old data into new group path
    await setDoc(doc(db,'groups',groupCode,'data','persons'),     {list: oldPersons});
    await setDoc(doc(db,'groups',groupCode,'data','entries'),     {list: oldEntries});
    await setDoc(doc(db,'groups',groupCode,'data','cycles'),      {list: oldCycles});
    await setDoc(doc(db,'groups',groupCode,'data','activeCycle'), {value: oldCycle});

    // Switch into the group
    GROUP_ID = groupCode;
    window.location.hash = groupCode;
    STATE.persons = oldPersons;
    STATE.entries = oldEntries;
    STATE.cycles  = oldCycles;
    STATE.activeCycle = oldCycle;

    const el = document.getElementById('migrate-result');
    if(el){
      el.innerHTML = \`<div style="background:#EAF3DE;border-radius:12px;padding:1.25rem;text-align:center;margin-top:1rem">
        <div style="font-size:20px;margin-bottom:6px">✅</div>
        <div style="font-weight:600;color:#085041;margin-bottom:6px">مۇۋەپپەقىيەتلىك كۆچۈرۈلدى!</div>
        <div style="font-size:13px;color:#27500A;margin-bottom:12px">\${oldPersons.length} ئەزا، \${oldEntries.length} خاتىرە كۆچۈرۈلدى.</div>
        <div style="font-size:12px;color:#555;margin-bottom:12px;background:#fff;border-radius:8px;padding:10px;direction:ltr">
          گۇرۇپپا ئۇلانمىسى:<br><strong>https://mustakimagazinl-spec.github.io/kitab-okux-v2/#okush2026</strong>
        </div>
        <button onclick="renderHome();showView('view-home');" 
          style="background:#0F6E56;color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;cursor:pointer;font-weight:500">ئەپنى ئاچىش</button>
      </div>\`;
    }
  } catch(err) {
    const el = document.getElementById('migrate-result');
    if(el)el.innerHTML = \`<div style="background:#FCEBEB;border-radius:10px;padding:12px;color:#A32D2D;font-size:13px;margin-top:1rem">خاتالىق: \${err.message}</div>\`;
    if(btn){btn.textContent='قايتا سىناڭ';btn.disabled=false;}
  }
};


async function runMigrationFromLanding() {
  if(!confirm('كونا سانلىق مەلۇماتلارنى okush2026 گۇرۇپپىسىغا كۆچۈرەمسىز؟')) return;
  var btn = document.getElementById('migrate-landing-btn');
  var resEl = document.getElementById('landing-migrate-result');
  if(btn){ btn.textContent='كۆچۈرۈلۈۋاتىدۇ...'; btn.disabled=true; }
  try {
    var results = await Promise.all([
      getDoc(doc(db,'app','persons')),
      getDoc(doc(db,'app','entries')),
      getDoc(doc(db,'app','cycles')),
      getDoc(doc(db,'app','activeCycle'))
    ]);
    var oldPersons = results[0].exists() ? (results[0].data().list || []) : [];
    var oldEntries = results[1].exists() ? (results[1].data().list || []) : [];
    var oldCycles  = results[2].exists() ? (results[2].data().list || []) : [];
    var oldCycle   = results[3].exists() ? (results[3].data().value || null) : null;

    var groupCode = 'okush2026';
    await setDoc(doc(db,'groups',groupCode), {
      name: 'ئۇيغۇر بىر قەلىب باغچىسى كىتاب ئوقۇش گۇرۇپپىسى',
      pin: '1234',
      createdAt: today()
    });
    await setDoc(doc(db,'groups',groupCode,'data','persons'),     {list: oldPersons});
    await setDoc(doc(db,'groups',groupCode,'data','entries'),     {list: oldEntries});
    await setDoc(doc(db,'groups',groupCode,'data','cycles'),      {list: oldCycles});
    await setDoc(doc(db,'groups',groupCode,'data','activeCycle'), {value: oldCycle});

    GROUP_ID = groupCode;
    window.location.hash = groupCode;
    STATE.persons = oldPersons;
    STATE.entries = oldEntries;
    STATE.cycles  = oldCycles;
    STATE.activeCycle = oldCycle;

    if(resEl) {
      resEl.style.cssText = 'background:#EAF3DE;border-radius:10px;padding:10px 14px;color:#27500A;font-size:13px;margin-top:8px';
      resEl.textContent = oldPersons.length + ' ئەزا، ' + oldEntries.length + ' خاتىرە كۆچۈرۈلدى! ئەپ ئېچىلىۋاتىدۇ...';
    }
    setTimeout(function(){ renderHome(); }, 1500);
  } catch(err) {
    if(resEl) {
      resEl.style.cssText = 'background:#FCEBEB;border-radius:10px;padding:10px 14px;color:#A32D2D;font-size:13px;margin-top:8px';
      resEl.textContent = 'خاتالىق: ' + err.message;
    }
    if(btn){ btn.textContent='كونا سانلىق مەلۇماتلارنى كۆچۈرۈش'; btn.disabled=false; }
  }
}
