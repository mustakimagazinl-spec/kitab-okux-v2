const INACTIVE_DAYS = 3;
let GID = null;
let S = {persons:[],entries:[],cycles:[],activeCycle:null};

function gd(path){ return doc(db,'groups',GID,...path.split('/')); }
async function loadAll(){
  const [a,b,c,d] = await Promise.all([
    getDoc(gd('data/persons')), getDoc(gd('data/entries')),
    getDoc(gd('data/cycles')),  getDoc(gd('data/activeCycle'))
  ]);
  S.persons     = a.exists() ? a.data().list  || [] : [];
  S.entries     = b.exists() ? b.data().list  || [] : [];
  S.cycles      = c.exists() ? c.data().list  || [] : [];
  S.activeCycle = d.exists() ? d.data().value || null : null;
}
async function saveP(){ await setDoc(gd('data/persons'),     {list:S.persons}); }
async function saveE(){ await setDoc(gd('data/entries'),     {list:S.entries}); }
async function saveC(){ await setDoc(gd('data/cycles'),      {list:S.cycles}); }
async function saveA(){ await setDoc(gd('data/activeCycle'), {value:S.activeCycle}); }

function toDay(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function ini(n){ return n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function p(i){ return PALETTES[i%8]; }
function dbw(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function H(id,html){ const e=document.getElementById(id); if(e) e.innerHTML=html; }
function quote(){ return QUOTES[Math.floor(Date.now()/86400000)%QUOTES.length]; }

function streak(name){
  const cy=S.activeCycle;
  const dates=[...new Set(S.entries.filter(e=>e.person===name&&(!cy||e.cycleId===cy.id)).map(e=>e.date))].sort().reverse();
  if(!dates.length) return 0;
  let s=0,cur=new Date(toDay());
  for(const d of dates){
    const diff=Math.round((cur-new Date(d))/86400000);
    if(diff===s){s++;cur=new Date(d);}else if(diff>1)break;
  }
  return s;
}

function inactive(name){
  const cy=S.activeCycle;
  const last=S.entries.filter(e=>e.person===name&&(!cy||e.cycleId===cy.id)).map(e=>e.date).sort().pop();
  return !last || dbw(last,toDay())>=INACTIVE_DAYS;
}

function books(name){
  const fromE=[...new Set(S.entries.filter(e=>e.person===name&&e.book).map(e=>e.book))];
  const fromP=S.persons.find(x=>x.name===name)?.book||'';
  return [...new Set([fromP,...fromE].filter(Boolean))];
}

function milestone(total){
  if(total===100) return 'مۇبارەك! 100 بەتكە يەتتىڭىز! «كىچىك قەدەملەر چوڭ يوللارنى باسىدۇ.» داۋاملاشتۇرۇڭ! 🌱';
  if(total===300) return 'ماشاءاللاھ! 300 بەت! ئاللاھ سىزنى مۇۋەپپەقىيەتلىك قىلسۇن! 📖';
  if(total===500) return 'سۇبھاناللاھ! 500 بەت! «ئىلىم تەلەپ قىلىش ھەر بىر مۇسۇلمانغا پەرزدۇر.» 🌟';
  if(total===1000) return 'ئاللاھۇ ئەكبەر! 1000 بەت! ئاللاھ مۇبارەك قىلسۇن! 🏆';
  if(total===2000) return 'ماشاءاللاھ تەبارەكەللاھ! 2000 بەت! ✨';
  return null;
}

function show(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
}

async function doJoin(){
  const code = (document.getElementById('join-code').value||'').trim().toLowerCase();
  const errEl = document.getElementById('join-err');
  errEl.style.display='none';
  if(!code){ errEl.textContent='كودنى كىرگۈزۈڭ.'; errEl.style.display='block'; return; }
  const snap = await getDoc(doc(db,'groups',code));
  if(!snap.exists()){ errEl.textContent='بۇ كود تېپىلمىدى. قايتا تەكشۈرۈڭ.'; errEl.style.display='block'; return; }
  GID = code;
  window.location.hash = code;
  await loadAll();
  renderHome();
}

async function doMigrate(){
  if(!confirm('كونا سانلىق مەلۇماتلارنى okush2026 گۇرۇپپىسىغا كۆچۈرەمسىز؟')) return;
  const btn = document.getElementById('btn-migrate');
  const resEl = document.getElementById('migrate-result');
  btn.textContent = 'كۆچۈرۈلۈۋاتىدۇ...';
  btn.disabled = true;
  try {
    const [a,b,c,d] = await Promise.all([
      getDoc(doc(db,'app','persons')),
      getDoc(doc(db,'app','entries')),
      getDoc(doc(db,'app','cycles')),
      getDoc(doc(db,'app','activeCycle'))
    ]);
    const oP = a.exists() ? a.data().list||[] : [];
    const oE = b.exists() ? b.data().list||[] : [];
    const oC = c.exists() ? c.data().list||[] : [];
    const oA = d.exists() ? d.data().value||null : null;

    const code = 'okush2026';
    await setDoc(doc(db,'groups',code), {
      name:'ئۇيغۇر بىر قەلىب باغچىسى كىتاب ئوقۇش گۇرۇپپىسى',
      pin:'1234', createdAt:toDay()
    });
    await setDoc(doc(db,'groups',code,'data','persons'),     {list:oP});
    await setDoc(doc(db,'groups',code,'data','entries'),     {list:oE});
    await setDoc(doc(db,'groups',code,'data','cycles'),      {list:oC});
    await setDoc(doc(db,'groups',code,'data','activeCycle'), {value:oA});

    GID=code; window.location.hash=code;
    S.persons=oP; S.entries=oE; S.cycles=oC; S.activeCycle=oA;

    resEl.className='alert-green';
    resEl.textContent = oP.length + ' ئەزا، ' + oE.length + ' خاتىرە كۆچۈرۈلدى! ئەپ ئېچىلىۋاتىدۇ...';
    setTimeout(function(){ renderHome(); }, 1500);
  } catch(err) {
    resEl.className='alert-red';
    resEl.textContent = 'خاتالىق: ' + err.message;
    btn.textContent='كونا سانلىق مەلۇماتلارنى كۆچۈرۈش';
    btn.disabled=false;
  }
}

  const myE=S.entries.filter(function(e){return e.person===name&&(!cy||e.cycleId===cy.id);});

      '<div style="min-width:130px"><label style="font-size:12px;color:' + pl.m + ';display:block;margin-bottom:4px">كۈن</label>' +
      '<input type="date" id="pp-date" value="' + toDay() + '" style="width:100%;padding:9px 10px;border:1.5px solid ' + pl.border + ';border-radius:8px;font-size:13px;background:' + pl.bg + '"/></div>' +
      '</div>' +
      '<div id="pp-newbook-wrap" style="display:none;margin-bottom:8px">' +
      '<input type="text" id="pp-newbook-inline" placeholder="يېڭى كىتاب ئىسمى..." style="width:100%;padding:9px 10px;border:1.5px solid ' + pl.border + ';border-radius:8px;font-size:14px"/>' +
      '</div>' +
      '<button id="btn-save-entry" style="background:' + pl.m + ';color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:15px;cursor:pointer;font-weight:600">ساقلاش</button>' +
      '<div id="pp-msg" style="font-size:13px;margin-top:8px;display:none"></div>';
  }
  html += '</div>';

  // Recent entries
  if(myE.length){
    const sorted=myE.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,10);
    html += '<div class="card"><div style="font-size:14px;font-weight:500;color:' + pl.m + ';margin-bottom:10px">ئاخىرقى خاتىرىلەر</div><div id="pp-entries">';
    sorted.forEach(function(e,ei){
      const gIdx=S.entries.findIndex(function(x){return x.person===e.person&&x.date===e.date&&x.cycleId===e.cycleId&&x.pages===e.pages;});
      html +=
        '<div id="pp-row-' + ei + '" style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:' + pl.bg + ';border-radius:8px;margin-bottom:6px;font-size:13px;flex-wrap:wrap">' +

        '<button class="pp-del-btn" data-gidx="' + gIdx + '" style="background:none;border:0.5px solid #F0957580;border-radius:6px;padding:4px 9px;font-size:11px;color:#A32D2D;cursor:pointer">ئۆچۈر</button>' +
        '</div>';
    });
    html += '</div></div>';
  }

  // Book history
  if(allBooks.length){
    html += '<div class="card"><div style="font-size:14px;font-weight:500;color:' + pl.m + ';margin-bottom:10px">📚 ئوقۇغان كىتابلار تارىخى</div>';
    allBooks.forEach(function(book){
      const bTotal=[...S.entries.filter(function(e){return e.person===name&&e.book===book;}),
        ...S.cycles.flatMap(function(c){return (c.entries||[]).filter(function(e){return e.person===name&&e.book===book;});})
      ].reduce(function(s,e){return s+e.pages;},0);

  H('view-participant', html);

  document.getElementById('btn-back-pp').addEventListener('click', function(){ renderHome(); });

  document.getElementById('btn-add-book').addEventListener('click', async function(){
    const val=(document.getElementById('pp-newbook').value||'').trim();
    if(!val) return;
    const pidx=S.persons.findIndex(function(x){return x.name===name;});
    if(pidx>=0 && !S.persons[pidx].book){ S.persons[pidx].book=val; await saveP(); }
    const msg=document.getElementById('book-msg');
    msg.textContent=val+' قوشۇلدى!'; msg.style.color='#3B6D11'; msg.style.display='block';
    document.getElementById('pp-newbook').value='';
    setTimeout(function(){ renderParticipant(name,idx); show('view-participant'); }, 600);
  });

  document.getElementById('btn-save-int').addEventListener('click', async function(){
    const val=(document.getElementById('pp-intention').value||'').trim();
    const pidx=S.persons.findIndex(function(x){return x.name===name;});
    if(pidx>=0){ S.persons[pidx].intention=val; await saveP(); }
    const msg=document.getElementById('int-msg');
    msg.textContent='«نِيَّةُ الْمُؤْمِنِ خَيْرٌ مِنْ عَمَلِهِ» — نىيىتىڭىز ساقلاندى! 🤲';
    msg.style.color='#3B6D11'; msg.style.display='block';
    setTimeout(function(){ renderParticipant(name,idx); show('view-participant'); }, 800);
  });

  const bookSel=document.getElementById('pp-book-sel');
  if(bookSel){
    bookSel.addEventListener('change', function(){
      const wrap=document.getElementById('pp-newbook-wrap');
      if(wrap) wrap.style.display=this.value==='__new__'?'block':'none';
    });
  }

  const saveBtn=document.getElementById('btn-save-entry');
  if(saveBtn){
    saveBtn.addEventListener('click', async function(){
      const pages=parseInt(document.getElementById('pp-pages').value);
      const date=document.getElementById('pp-date').value;
      const msg=document.getElementById('pp-msg');
      if(!pages||pages<1){ msg.textContent='بەت سانىنى كىرگۈزۈڭ'; msg.style.color='#993C1D'; msg.style.display='block'; return; }
      let book=(document.getElementById('pp-book-sel').value||'');
      if(book==='__new__') book=(document.getElementById('pp-newbook-inline').value||'').trim();
      const cy2=S.activeCycle;
      const ei=S.entries.findIndex(function(e){return e.person===name&&e.date===date&&(!cy2||e.cycleId===cy2.id);});
      if(ei>=0) S.entries.splice(ei,1);
      S.entries.push({person:name,pages:pages,date:date,book:book,cycleId:cy2?cy2.id:'free'});
      if(book){
        const pidx2=S.persons.findIndex(function(x){return x.name===name;});
        if(pidx2>=0&&!S.persons[pidx2].book){ S.persons[pidx2].book=book; await saveP(); }
      }
      await saveE();
      msg.textContent=pages+' بەت مۇۋەپپەقىيەتلىك ساقلاندى! ✅'; msg.style.color='#3B6D11'; msg.style.display='block';
      setTimeout(function(){ renderParticipant(name,idx); show('view-participant'); }, 700);
    });
  }

  document.querySelectorAll('.pp-edit-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      const ei=parseInt(btn.dataset.ei);
      const gIdx=parseInt(btn.dataset.gidx);
      const e=S.entries[gIdx]; if(!e) return;
      const row=document.getElementById('pp-row-'+ei);
      row.innerHTML=
        '<span style="color:' + pl.avT + ';min-width:95px">' + e.date + '</span>' +
        '<input type="number" id="pp-inline-' + ei + '" value="' + e.pages + '" min="1" style="width:70px;padding:4px 8px;border:1.5px solid ' + pl.m + ';border-radius:6px;font-size:13px"/>' +
        '<span style="font-size:12px;color:' + pl.m + '">بەت</span>' +
        '<button id="pp-save-' + ei + '" style="background:' + pl.m + ';color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer">ساقلاش</button>' +
        '<button id="pp-cancel-' + ei + '" style="background:none;border:0.5px solid #ddd;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;color:#888">بىكار</button>';
      document.getElementById('pp-save-'+ei).addEventListener('click', async function(){
        const val=parseInt(document.getElementById('pp-inline-'+ei).value);
        if(!val||val<1){alert('توغرا سان كىرگۈزۈڭ.');return;}
        S.entries[gIdx].pages=val; await saveE();
        renderParticipant(name,idx); show('view-participant');
      });
      document.getElementById('pp-cancel-'+ei).addEventListener('click', function(){
        renderParticipant(name,idx); show('view-participant');
      });
    });
  });

  document.querySelectorAll('.pp-del-btn').forEach(function(btn){
    btn.addEventListener('click', async function(){
      if(!confirm('بۇ خاتىرىنى ئۆچۈرەمسىز؟')) return;
      S.entries.splice(parseInt(btn.dataset.gidx),1);
      await saveE(); renderParticipant(name,idx); show('view-participant');
    });
  });
}

let pinVal='';
function renderPin(){
  pinVal='';
  H('view-pin',
    '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;gap:1rem">' +
    '<div style="font-size:18px;font-weight:600;color:#534AB7">باشقۇرغۇچى كىرىش</div>' +
    '<div style="font-size:13px;color:#888">PIN كودىنى كىرگۈزۈڭ</div>' +
    '<div style="display:flex;gap:12px;margin:1rem 0" id="pin-dots">' +
    '<div id="pd0" style="width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid #ccc"></div>' +
    '<div id="pd1" style="width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid #ccc"></div>' +
    '<div id="pd2" style="width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid #ccc"></div>' +
    '<div id="pd3" style="width:14px;height:14px;border-radius:50%;background:#eee;border:1px solid #ccc"></div>' +
    '</div>' +
    '<div id="pin-err" style="font-size:13px;color:#A32D2D;height:18px"></div>' +
    '<div style="display:grid;grid-template-columns:repeat(3,64px);gap:8px" id="pin-pad"></div>' +
    '<button id="btn-pin-back" class="btn-ghost" style="margin-top:1rem">بەكىتىش</button>' +
    '</div>'
  );
  const pad=document.getElementById('pin-pad');
  [1,2,3,4,5,6,7,8,9,'',0,'⌫'].forEach(function(k){
    const btn=document.createElement('button');
    btn.textContent=k;
    btn.style.cssText='width:64px;height:64px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:18px;font-weight:500;cursor:pointer;' + (k===''?'visibility:hidden':'');
    btn.addEventListener('click', async function(){
      if(k==='⌫'){ pinVal=pinVal.slice(0,-1); }
      else if(pinVal.length<4&&k!==''){ pinVal+=k; }
      for(let i=0;i<4;i++){
        const d=document.getElementById('pd'+i);
        if(d){ d.style.background=i<pinVal.length?'#534AB7':'#eee'; d.style.borderColor=i<pinVal.length?'#534AB7':'#ccc'; }
      }
      if(pinVal.length===4){
        const snap=await getDoc(doc(db,'groups',GID));
        const correct=snap.exists()?snap.data().pin:'1234';
        if(pinVal===correct){ renderAdmin('members'); show('view-admin'); }
        else{
          document.getElementById('pin-err').textContent='PIN خاتا. قايتا سىناڭ.';
          pinVal='';
          for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.style.background='#eee';d.style.borderColor='#ccc';}}
        }
      }
    });
    pad.appendChild(btn);
  });
  document.getElementById('btn-pin-back').addEventListener('click', function(){ renderHome(); });
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function renderAdmin(tab){
  const tabs=['members','cycle','entries','summary','leaderboard','archive','export','settings'];
  const labels=['ئەزالار','چەمبەر','خاتىرىلەر','خۇلاسە','رەتلىك','ئارخىپ','چىقىرىش','تەڭشەك'];
  let html =
    '<div style="background:linear-gradient(135deg,#534AB7,#3C3489);padding:1rem;color:#fff;display:flex;align-items:center;justify-content:space-between">' +
    '<div style="font-size:16px;font-weight:600">باشقۇرغۇچى تاختىسى</div>' +
    '<button id="btn-admin-back" style="background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">&#8592; باش بەت</button>' +
    '</div>' +
    '<div style="display:flex;overflow-x:auto;border-bottom:1px solid #eee;background:#fff">';
  tabs.forEach(function(t,i){
    html += '<button class="admin-tab-btn" data-tab="' + t + '" style="padding:10px 12px;font-size:12px;cursor:pointer;border:none;background:transparent;color:' + (t===tab?'#534AB7':'#888') + ';border-bottom:' + (t===tab?'2px solid #534AB7':'2px solid transparent') + ';white-space:nowrap;font-weight:' + (t===tab?'600':'400') + '">' + labels[i] + '</button>';
  });
  html += '</div><div id="admin-body" style="padding:1rem"></div>';
  html += '<div class="footer-dua">بۇ ئەمگەكنى روياپقا چىقارغان قېرىندىشىڭىزنى سالىھ دۇئالىرىڭىزدا ئۇنۇتمىغايسىز 🤲</div>';
  H('view-admin', html);

  document.getElementById('btn-admin-back').addEventListener('click', function(){ renderHome(); });
  document.querySelectorAll('.admin-tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){ renderAdmin(btn.dataset.tab); show('view-admin'); });
  });
  renderAdminTab(tab);
  show('view-admin');
}

function renderAdminTab(tab){
  const el=document.getElementById('admin-body');
  if(!el) return;
  if(tab==='members')      renderTabMembers(el);
  else if(tab==='cycle')   renderTabCycle(el);
  else if(tab==='entries') renderTabEntries(el);
  else if(tab==='summary') renderTabSummary(el);
  else if(tab==='leaderboard') renderTabLeaderboard(el);
  else if(tab==='archive') renderTabArchive(el);
  else if(tab==='export')  renderTabExport(el);
  else if(tab==='settings')renderTabSettings(el);
}

function renderTabCycle(el){
  const cy=S.activeCycle;
  if(cy){
    el.innerHTML=
      '<div class="card">' +
      '<div class="alert-green" style="margin-bottom:1rem">پائال چەمبەر: <strong>' + cy.name + '</strong> — ' + cy.start + '</div>' +
      '<button id="btn-end-cycle" style="background:#BA7517;color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;cursor:pointer">چەمبەرنى ئاخىرلاشتۇرۇش</button>' +
      '</div>';
    document.getElementById('btn-end-cycle').addEventListener('click', async function(){
      if(!confirm('چەمبەرنى ئاخىرلاشتۇرامسىز؟')) return;
      S.activeCycle.end=toDay();
      S.cycles.push(Object.assign({},S.activeCycle,{entries:S.entries.filter(function(e){return e.cycleId===S.activeCycle.id;})}));
      await saveC(); S.activeCycle=null; await saveA();
      el.innerHTML='<div class="card" style="text-align:center"><div style="font-size:24px;margin-bottom:8px">📚</div>' +
        '<div style="font-size:16px;font-weight:600;color:#085041;margin-bottom:8px">اَلْحَمْدُ لِلَّهِ!</div>' +
        '<div style="font-size:13px;color:#27500A;line-height:1.8">بۇ چەمبەر مۇۋەپپەقىيەتلىك تاماملاندى. ھەممىڭلارنىڭ ئەمگىكى قوبۇل بولسۇن!</div></div>';
    });
  } else {
    el.innerHTML=
      '<div class="card">' +
      '<div style="font-size:14px;font-weight:500;margin-bottom:12px">يېڭى چەمبەر باشلاش</div>' +
      '<label style="font-size:13px;color:#888;display:block;margin-bottom:4px">چەمبەر ئىسمى</label>' +
      '<input type="text" id="cy-name" class="input-field" placeholder="مەسىلەن: مايىس 2026"/>' +
      '<label style="font-size:13px;color:#888;display:block;margin-bottom:4px">باشلاش كۈنى</label>' +
      '<input type="date" id="cy-start" class="input-field" value="' + toDay() + '"/>' +
      '<button id="btn-start-cycle" class="btn-primary">چەمبەر باشلاش</button>' +
      '</div>';
    document.getElementById('btn-start-cycle').addEventListener('click', async function(){
      const name=(document.getElementById('cy-name').value||'').trim();
      const start=document.getElementById('cy-start').value;
      if(!name||!start){ alert('ئىسىم ۋە كۈننى كىرگۈزۈڭ.'); return; }
      S.activeCycle={id:'cycle_'+Date.now(),name:name,start:start,end:null};
      await saveA(); renderAdminTab('cycle');
    });
  }

function renderTabEntries(el){
  const cy=S.activeCycle;
  const entries=S.entries.filter(function(e){return !cy||e.cycleId===cy.id;}).slice().sort(function(a,b){return b.date.localeCompare(a.date);});
  if(!entries.length){ el.innerHTML='<div class="alert-yellow">خاتىرە يوق.</div>'; return; }
  let html='<div class="card" style="padding:0">';
  entries.forEach(function(e,i){
    const pidx=S.persons.findIndex(function(x){return x.name===e.person;});
    const pl=p(pidx>=0?pidx:i%8);

function renderTabLeaderboard(el){
  const cy=S.activeCycle;
  if(!cy){ el.innerHTML='<div class="alert-yellow">پائال چەمبەر يوق.</div>'; return; }
  const stats=S.persons.map(function(person,i){
    const pe=S.entries.filter(function(e){return e.person===person.name&&e.cycleId===cy.id;});
    return {name:person.name,total:pe.reduce(function(s,e){return s+e.pages;},0),days:new Set(pe.map(function(e){return e.date;})).size,i:i,isIn:inactive(person.name),st:streak(person.name)};
  }).sort(function(a,b){return b.total-a.total;});
  const maxP=stats[0]?stats[0].total:1;
  const gTotal=stats.reduce(function(s,x){return s+x.total;},0);
  const medals=['🥇','🥈','🥉'];
  let html=
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem">' +
    '<div style="background:#EEEDFE;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#534AB7;font-weight:600">جەمئىي بەت</div><div style="font-size:22px;font-weight:700;color:#26215C">' + gTotal + '</div></div>' +
    '<div style="background:#E1F5EE;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#0F6E56;font-weight:600">بىرىنچى</div><div style="font-size:13px;font-weight:700;color:#04342C">' + (stats[0]?stats[0].name:'-') + '</div></div>' +
    '<div style="background:#E6F1FB;border-radius:10px;padding:12px;text-align:center"><div style="font-size:10px;color:#185FA5;font-weight:600">ئەزا</div><div style="font-size:22px;font-weight:700;color:#042C53">' + S.persons.length + '</div></div>' +
    '</div><div class="card" style="padding:0">';
  stats.forEach(function(s,rank){
    const pl=p(s.i);

    html +=
      '<div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:0.5px solid #f5f5f5">' +
      '<div style="font-size:18px;min-width:28px;text-align:center">' + (rank<3?medals[rank]:rank+1) + '</div>' +
      '<div style="width:32px;height:32px;border-radius:50%;background:' + pl.av + ';color:' + pl.avT + ';display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0">' + ini(s.name) + '</div>' +
      '<div style="flex:1;min-width:0">' +
      '<div style="display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:wrap">' +
      '<span style="font-weight:600;font-size:13px">' + s.name + '</span>' +
      (s.isIn?'<span style="background:#FCEBEB;color:#A32D2D;border-radius:20px;padding:1px 7px;font-size:10px">ھەرىكەتسىز</span>':'<span style="background:#EAF3DE;color:#3B6D11;border-radius:20px;padding:1px 7px;font-size:10px">ئاكتىپ</span>') +
      (s.st>=3?'<span style="background:' + pl.mL + ';color:' + pl.m + ';border-radius:20px;padding:1px 7px;font-size:10px">' + s.st + '🔥</span>':'') +
      '</div>' +
      '<div style="background:#f0f0f0;border-radius:4px;height:6px;overflow:hidden"><div style="height:100%;width:' + barW + '%;background:' + pl.m + '"></div></div>' +
      '</div>' +
      '<div style="text-align:right;min-width:60px"><div style="font-weight:700;color:' + pl.m + ';font-size:14px">' + s.total + '</div><div style="font-size:11px;color:#888">' + s.days + ' كۈن</div></div>' +

  });

  document.getElementById('btn-export').addEventListener('click', function(){ doExport(); });

function doExport(){
  const wb=XLSX.utils.book_new();
  const hs={fill:{fgColor:{rgb:'534AB7'}},font:{color:{rgb:'FFFFFF'},bold:true},alignment:{horizontal:'center'}};
  const allC=[];
  if(S.activeCycle) allC.push(Object.assign({},S.activeCycle,{entries:S.entries.filter(function(e){return e.cycleId===S.activeCycle.id;})}));
  S.cycles.slice().reverse().forEach(function(c){allC.push(c);});
  const sd=[['چەمبەر','ئىسىم','كىتاب','ئومۇمىي بەت','كۈن','ئوتتۇرا']];
  allC.forEach(function(c){
    S.persons.forEach(function(person){
      const pe=(c.entries||[]).filter(function(e){return e.person===person.name;});
      const total=pe.reduce(function(s,e){return s+e.pages;},0);
      const days=new Set(pe.map(function(e){return e.date;})).size;
      sd.push([c.name,person.name,books(person.name).join(', '),total,days,days?Math.round(total/days):0]);
    });
  });
  const sWS=XLSX.utils.aoa_to_sheet(sd);
  sWS['!cols']=[{wch:22},{wch:18},{wch:28},{wch:12},{wch:10},{wch:10}];
  ['A1','B1','C1','D1','E1','F1'].forEach(function(c){if(sWS[c])sWS[c].s=hs;});
  XLSX.utils.book_append_sheet(wb,sWS,'خۇلاسە');
  allC.forEach(function(c,ci){
    const entries=(c.entries||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    const rd=[['ئىسىم','كىتاب','كۈن','بەت سانى']];
    entries.forEach(function(e){ rd.push([e.person,e.book||'',e.date,e.pages]); });
    const ws=XLSX.utils.aoa_to_sheet(rd);
    ws['!cols']=[{wch:18},{wch:24},{wch:14},{wch:10}];
    ['A1','B1','C1','D1'].forEach(function(cell){if(ws[cell])ws[cell].s=hs;});
    for(let r=1;r<rd.length;r++){
      const pidx=S.persons.findIndex(function(x){return x.name===rd[r][0];});
      const pl=PALETTES[pidx>=0?pidx%8:r%8];
      const rc=pl.av.replace('#',''), tc=pl.avT.replace('#','');
      ['A','B','C','D'].forEach(function(col){const cell=col+(r+1);if(ws[cell])ws[cell].s={fill:{fgColor:{rgb:rc}},font:{color:{rgb:tc}}};});
    }
    XLSX.utils.book_append_sheet(wb,ws,(c.name||('چەمبەر '+(ci+1))).slice(0,28));
  });
  XLSX.writeFile(wb,'kitab-okux-hatirisi.xlsx');
}

async function init(){
  const hash=window.location.hash.replace('#','').trim().toLowerCase();

    const snap=await getDoc(doc(db,'groups',hash));
    if(snap.exists()){ GID=hash; await loadAll(); renderHome(); return; }

  renderLanding();
}
